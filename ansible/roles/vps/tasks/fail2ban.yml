---
- name: Install fail2ban
  ansible.builtin.apt:
    name: "fail2ban"
    update_cache: true
    state: present

- name: Copy fail2ban configuration
  ansible.builtin.template:
    src: "jail.conf.j2"
    dest: /etc/fail2ban/jail.local
    owner: root
    group: root
    mode: "0644"
  notify: Restart fail2ban
