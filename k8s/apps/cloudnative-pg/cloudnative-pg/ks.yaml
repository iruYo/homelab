---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cloudnative-pg-operator
spec:
  interval: 1h
  path: ./k8s/apps/cloudnative-pg/cloudnative-pg/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: cloudnative-pg
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cloudnative-pg-instance
spec:
  dependsOn:
  - name: cloudnative-pg-operator
  - name: rook-ceph-cluster
    namespace: rook-ceph
  interval: 1h
  path: ./k8s/apps/cloudnative-pg/cloudnative-pg/instance
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: cloudnative-pg
  wait: true
