---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: grafana-oauth-client
spec:
  updatePolicy: IfNotExists
  secretStoreRefs:
    - name: vault
      kind: ClusterSecretStore
  selector:
    generatorRef:
      apiVersion: generators.external-secrets.io/v1alpha1
      kind: ClusterGenerator
      name: password-gen
  data:
  - match:
      secretKey: password
      remoteRef:
        remoteKey: k8s/authentik/apps/grafana
        property: client-id
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: grafana-oauth-secret
spec:
  updatePolicy: IfNotExists
  secretStoreRefs:
    - name: vault
      kind: ClusterSecretStore
  selector:
    generatorRef:
      apiVersion: generators.external-secrets.io/v1alpha1
      kind: ClusterGenerator
      name: password-gen
  data:
  - match:
      secretKey: password
      remoteRef:
        remoteKey: k8s/authentik/apps/grafana
        property: client-secret
