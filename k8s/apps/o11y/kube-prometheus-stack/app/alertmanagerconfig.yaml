---
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: alertmanager
spec:
  route:
    receiver: pushover
    repeatInterval: 12h
    routes:
    - receiver: blackhole
      matchers:
      - name: alertname
        value: InfoInhibitor
        matchType: =
    - receiver: blackhole # Todo: Proper healthcheckc
      matchers:
      - name: alertname
        value: Watchdog
        matchType: =
    - receiver: discord
      continue: true
      matchers:
      - name: severity
        value: critical
        matchType: =
    - receiver: pushover
      matchers:
      - name: severity
        value: critical
        matchType: =
    groupBy:
    - alertname
    - cluster
    - job
    groupInterval: 5m
    groupWait: 1m

  inhibitRules:
  - equal:
    - alertname
    - namespace
    sourceMatch:
    - name: severity
      value: critical
      matchType: =
    targetMatch:
    - name: severity
      value: warning
      matchType: =

  receivers:
  - name: blackhole
  - name: discord
    discordConfigs:
    - apiURL:
        name: alertmanager-secret
        key: DISCORD_WEBHOOK
      title: |-
        {{- if eq .Status "firing" }}🚨 **ALERT FIRING** 🚨{{- else }}✅ **ALERT RESOLVED** ✅{{- end }}
      message: |-
        {{- range .Alerts }}

        {{- if eq .Labels.severity "critical" }}
        🚨 **Severity:** `CRITICAL`
        {{- else if eq .Labels.severity "warning" }}
        ⚠️ **Severity:** `WARNING`
        {{- else if eq .Labels.severity "info" }}
        ℹ️ **Severity:** `INFO`
        {{- else }}
        > 📊 **Severity:** `{{ .Labels.severity }}`
        {{- end }}

        {{- if ne .Annotations.description "" }}
        📝 **Description:**

        ```
        {{ .Annotations.description }}
        ```
        {{- else if ne .Annotations.summary "" }}
        📋 **Summary:**
        ```
        {{ .Annotations.summary }}
        ```
        {{- else if ne .Annotations.message "" }}
        💬 **Message:**
        ```
        {{ .Annotations.message }}
        ```
        {{- else }}
        🔔 Alert has been triggered
        {{- end }}

        ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

        **Alert Details:**
        {{- if .Labels.node }}
        🖥️ **Node:** `{{ .Labels.node }}`
        {{- end }}
        {{- if .Labels.namespace }}
        Namespace: `{{ .Labels.namespace }}`
        {{- end }}
        {{- if .Labels.pod }}
        Pod: `{{ .Labels.pod }}`
        {{- end }}
        {{- if .Labels.job }}
        Job: `{{ .Labels.job }}`
        {{- end }}
        {{- if .Labels.instance }}
        Instance: `{{ .Labels.instance }}`
        {{- end }}
        {{- if .Labels.container }}
        Container: `{{ .Labels.container }}`
        {{- end }}
        {{- if .Labels.service }}
        Service: `{{ .Labels.service }}`
        {{- end }}

        ⏰ **Timeline:**
        {{- if eq .Status "firing" }}
        🔥 Started: <t:{{ .StartsAt.Unix }}:F> (<t:{{ .StartsAt.Unix }}:R>)
        {{- else }}
        ✅ Resolved: <t:{{ .EndsAt.Unix }}:F> (<t:{{ .EndsAt.Unix }}:R>)
        🕐 Duration: {{ .StartsAt | since | humanizeDuration }}
        {{- end }}

        {{- end }}
  - name: pushover
    pushoverConfigs:
    - html: true
      message: |-
        {{- range .Alerts }}
          {{- if ne .Annotations.description "" }}
            {{ .Annotations.description }}
          {{- else if ne .Annotations.summary "" }}
            {{ .Annotations.summary }}
          {{- else if ne .Annotations.message "" }}
            {{ .Annotations.message }}
          {{- else }}
            Alert description not available
          {{- end }}
          {{- if gt (len .Labels.SortedPairs) 0 }}
            <small>
              {{- range .Labels.SortedPairs }}
                <b>{{ .Name }}:</b> {{ .Value }}
              {{- end }}
            </small>
          {{- end }}
        {{- end }}
      monospace: false
      priority: |-
        {{ if eq .Status "firing" }}1{{ else }}0{{ end }}
      sendResolved: true
      sound: gamelan
      title: >-
        [{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .CommonLabels.alertname }}
      ttl: 86400s
      token:
        name: alertmanager-secret
        key: ALERTMANAGER_PUSHOVER_TOKEN
      userKey:
        name: alertmanager-secret
        key: PUSHOVER_USER_KEY
      urlTitle: View in Alertmanager
