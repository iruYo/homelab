---
apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  name: grafana
  labels:
    dashboards: grafana
spec:
  config:
    analytics:
      check_for_updates: "false"
      check_for_plugin_updates: "false"
      feedback_links_enabled: "false"
      reporting_enabled: "false"
    auth:
      disable_login_form: "true"
      signout_redirect_url: "https://auth.youriulbri.ch/application/o/grafana/end-session/"
    auth.generic_oauth:
      enabled: "true"
      name: "Authentik"
      scopes: "openid email profile"
      auth_url: https://auth.youriulbri.ch/application/o/authorize/
      token_url: https://auth.youriulbri.ch/application/o/token/
      api_url: https://auth.youriulbri.ch/application/o/userinfo/
      allow_sign_up: "false"
      role_attribute_strict: "true"
      use_pkce: "true"
    auth.generic_oauth.group_mapping:
      role_attribute_path: |
        contains(groups[*], 'authentik Admins') && 'Admin' || 'Viewer'
    log:
      mode: console
    metrics:
      enabled: "true"
    news:
      news_feed_enabled: "false"
    plugins:
      plugin_admin_enabled: "false"
    security:
      angular_support_enabled: "true"
    server:
      enable_gzip: "true"
      root_url: https://grafana.youriulbri.ch
  deployment:
    spec:
      strategy:
        type: Recreate
      template:
        spec:
          containers:
          - name: grafana
            env:
            - name: GF_AUTH_GENERIC_OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: grafana-oauth-credentials
                  key: client-id
            - name: GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: grafana-oauth-credentials
                  key: client-secret
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
          volumes:
          - name: grafana-data
            persistentVolumeClaim:
              claimName: grafana-pvc
  httpRoute:
    spec:
      hostnames:
      - grafana.youriulbri.ch
      parentRefs:
      - name: gateway-internal
        namespace: network
  persistentVolumeClaim:
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 10Gi
      storageClassName: ceph-block
  disableDefaultSecurityContext: All
