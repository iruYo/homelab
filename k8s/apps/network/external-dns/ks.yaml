---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-dns
spec:
  dependsOn:
  - name: amazon-eks-pod-identity-webhook
    namespace: amazon-eks-pod-identity-webhook
  healthChecks:
  - apiVersion: helm.toolkit.fluxcd.io/v2
    kind: HelmRelease
    name: external-dns
    namespace: network
  - apiVersion: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: dnsendpoints.externaldns.k8s.io
  interval: 1h
  path: ./k8s/apps/network/external-dns/app
  postBuild:
    substituteFrom:
    - kind: Secret
      name: external-dns-role-arn
      optional: true
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: network
  wait: true
