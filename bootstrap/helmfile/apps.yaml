---
helmDefaults:
  cleanupOnFail: true
  forceConflicts: true
  wait: true
  waitForJobs: true

bases:
- default.yaml

defaultInherit: default

releases:
- name: cilium
  namespace: kube-system
  hooks:
    - command: kubectl
      args:
      - wait
      - --for=create
      - crd/ciliumbgpadvertisements.cilium.io
      - crd/ciliumbgpclusterconfigs.cilium.io
      - crd/ciliumbgppeerconfigs.cilium.io
      - crd/ciliumloadbalancerippools.cilium.io
      - --timeout=2m
      events:
      - postsync
      showlogs: true
    - # Apply Resources
      command: kubectl
      args:
      - apply
      - --namespace={{ .Release.Namespace }}
      - --server-side
      - --force-conflicts
      - --filename=../../k8s/apps/{{ .Release.Namespace }}/{{ .Release.Name }}/app/networking.yaml
      events:
      - postsync
      showlogs: true

- name: coredns
  namespace: kube-system
  needs:
  - kube-system/cilium

- name: spegel
  namespace: kube-system
  needs:
  - kube-system/coredns

- name: cert-manager
  namespace: cert-manager
  needs:
  - kube-system/spegel
