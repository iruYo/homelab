---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-issuer
spec:
  acme:
    email: youri.ulbrich@web.de
    privateKeySecretRef:
      name: letsencrypt-prod-key
    profile: shortlived
    server: https://acme-v02.api.letsencrypt.org/directory
    solvers:
    - dns01:
        route53:
          region: eu-central-1
