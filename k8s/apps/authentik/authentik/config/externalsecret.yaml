---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: discord-oauth-secret
  namespace: authentik
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  data:
  - secretKey: discord_client_id
    remoteRef:
      key: k8s/apps/authentik/oauth/discord
      property: client-id
  - secretKey: discord_client_secret
    remoteRef:
      key: k8s/apps/authentik/oauth/discord
      property: client-secret
