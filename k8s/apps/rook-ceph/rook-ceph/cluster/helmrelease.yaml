---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph-cluster
spec:
  chartRef:
    kind: OCIRepository
    name: rook-ceph-cluster
  interval: 1h
  timeout: 10m
  values:
    cephConfig:
      global:
        bdev_enable_discard: true
        bdev_async_discard: true
        bdev_async_discard_threads: 1
        device_failure_prediction_mode: local
        mon_max_pg_per_osd: 400
        osd_class_update_on_start: false
    cephClusterSpec:
      cleanupPolicy:
        wipeDevicesFromOtherClusters: true
      crashCollector:
        disable: false
      csi:
        readAffinity:
          enabled: true
      dashboard:
        enabled: true
        urlPrefix: /
        ssl: false
        prometheusEndpoint: http://prometheus-operated.o11y.svc.cluster.local:9090
      mgr:
        modules:
        - name: diskprediction_local
          enabled: true
        - name: pg_autoscaler
          enabled: true
      network:
        connections:
          requireMsgr2: true
      placement:
        all:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
              - matchExpressions:
                - key: storage
                  operator: In
                  values:
                  - "true"
      resources:
        mgr:
          requests:
            cpu: 100m
          limits:
            memory: 1Gi
        mon:
          requests:
            cpu: 200m
          limits:
            memory: 1Gi
        osd:
          requests:
            cpu: 500m
          limits:
            memory: 5Gi
      storage:
        devicePathFilter: "^/dev/disk/by-partlabel/r-storage$"
        useAllDevices: false
        useAllNodes: true
    monitoring:
      enabled: true
      createPrometheusRules: true
    toolbox:
      enabled: true
    route:
      dashboard:
        host:
          name: rook.youriulbri.ch
          path: /
          pathType: PathPrefix
        parentRefs:
        - name: gateway-internal
          namespace: network
    cephBlockPools:
    - name: ceph-blockpool
      spec:
        failureDomain: host
        replicated:
          size: 3
      storageClass:
        enabled: true
        name: ceph-block
        allowVolumeExpansion: true
        isDefault: true
        mountOptions:
        - discard
        parameters:
          compression_algorithm: lz4
          compression_mode: passive
          csi.storage.k8s.io/controller-expand-secret-name: rook-csi-rbd-provisioner
          csi.storage.k8s.io/controller-expand-secret-namespace: "{{ .Release.Namespace }}"
          csi.storage.k8s.io/controller-publish-secret-name: rook-csi-rbd-provisioner
          csi.storage.k8s.io/controller-publish-secret-namespace: "{{ .Release.Namespace }}"
          csi.storage.k8s.io/node-stage-secret-name: rook-csi-rbd-node
          csi.storage.k8s.io/node-stage-secret-namespace: "{{ .Release.Namespace }}"
          csi.storage.k8s.io/provisioner-secret-name: rook-csi-rbd-provisioner
          csi.storage.k8s.io/provisioner-secret-namespace: "{{ .Release.Namespace }}"
          imageFeatures: deep-flatten,exclusive-lock,fast-diff,layering,object-map
          imageFormat: "2"
        reclaimPolicy: Delete
        volumeBindingMode: Immediate
    cephBlockPoolsVolumeSnapshotClass:
      enabled: true
      name: csi-ceph-blockpool
      deletionPolicy: Delete
      isDefault: true
    cephFileSystems: []
    cephFileSystemVolumeSnapshotClass:
      enabled: false
    cephObjectStores: []
