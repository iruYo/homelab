---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres18
spec:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: storage
            operator: In
            values:
            - "true"
  instances: 3
  # Todo: create authentik db role and pass creds in authentik namespace
  # https://github.com/cloudnative-pg/cloudnative-pg/issues/6043
  # https://github.com/EnterpriseDB/cloudnative-pg/blob/f57d7410af4e1c7cf2447f1bc9d7a1d6cc3cb2a8/docs/src/samples/role-examples.yaml
  monitoring:
    enablePodMonitor: true
  postgresql:
    parameters:
      huge_pages: "off"
      max_connections: "200"
      shared_buffers: 512MB
      effective_cache_size: 6GB
      work_mem: 12MB
      maintenance_work_mem: 512MB
      max_worker_processes: "4"
      min_wal_size: 2GB
      max_wal_size: 8GB
      checkpoint_timeout: 15min
      checkpoint_completion_target: "0.9"
      wal_compression: "zstd"
      autovacuum_vacuum_scale_factor: "0.05"
      autovacuum_analyze_scale_factor: "0.02"
      autovacuum_vacuum_threshold: "20"
      autovacuum_analyze_threshold: "10"
      autovacuum_vacuum_cost_limit: "2000"
      autovacuum_vacuum_cost_delay: "5ms"
      default_statistics_target: "200"
      random_page_cost: "1.1"
      effective_io_concurrency: "200"
  resources:
    requests:
      cpu: 300m
      memory: 512Mi
    limits:
      memory: 2Gi
  storage:
    size: 20Gi
