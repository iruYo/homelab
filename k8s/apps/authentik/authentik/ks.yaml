---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: authentik
spec:
  interval: 1h
  path: ./k8s/apps/authentik/authentik/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: authentik
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: authentik-config
spec:
  dependsOn:
  - name: authentik
  - name: tofu-controller
    namespace: flux-system
  healthCheckExprs:
  - apiVersion: infra.contrib.fluxcd.io/v1alpha2
    kind: Terraform
    current: status.conditions.exists(e, e.type == 'Ready') && status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'True')
  interval: 1h
  path: ./k8s/apps/authentik/authentik/config
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: authentik
  wait: true
