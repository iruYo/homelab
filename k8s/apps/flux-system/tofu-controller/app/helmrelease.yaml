---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tofu-controller
spec:
  chartRef:
    kind: OCIRepository
    name: tofu-controller
  interval: 1h
  values:
    allowCrossNamespaceRefs: true
    runner:
      serviceAccount:
        allowedNamespaces: ["flux-system", "authentik"]
        create: true
        name: tf-runner
    serviceAccount:
      create: true
      name: tofu-controller
