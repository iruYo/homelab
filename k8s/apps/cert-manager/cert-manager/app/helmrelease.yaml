---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
spec:
  chartRef:
    kind: OCIRepository
    name: cert-manager
  interval: 1h
  values:
    crds:
      enabled: true
    deploymentAnnotations:
      secret.reloader.stakater.com/reload: "cert-manager-role-arn"
    dns01RecursiveNameservers: https://8.8.8.8:443/dns-query,https://8.8.4.4:443/dns-query,https://1.1.1.1:443/dns-query,https://1.0.0.1:443/dns-query
    dns01RecursiveNameserversOnly: true
    prometheus:
      enabled: true
      servicemonitor:
        enabled: true
    serviceAccount:
      annotations:
        eks.amazonaws.com/role-arn: "${ROLE_ARN}"
    webhook:
      replicaCount: 2
      podDisruptionBudget:
        enabled: true
